<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step 3: LOG puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7e8ea;--panel:#ffffff;--ink:#1c1d20;--mut:#62666d;--acc:#e3101f;--accink:#ffffff;--line:#c3c6cc;--board:#d9dbdf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--panel:#1e2024;--ink:#ececee;--mut:#9a9ea6;--acc:#ff3040;--accink:#ffffff;--line:#35383e;--board:#25272b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141517;--panel:#1e2024;--ink:#ececee;--mut:#9a9ea6;--acc:#ff3040;--accink:#ffffff;--line:#35383e;--board:#25272b;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:700;margin:0 auto 0 0}
button,select,.btn{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.stat{color:var(--mut);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:700}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#board{position:absolute;background:var(--board);outline:2px dashed var(--line);border-radius:2px}
#hintc{width:100%;height:100%;display:block;opacity:0;transition:opacity .2s}
#hintc.on{opacity:.28}
.piece{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));z-index:10}
.piece.lift{filter:drop-shadow(0 9px 10px rgba(0,0,0,.45))}
.piece.done{filter:none;z-index:1}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,12,15,.6);z-index:1000;padding:16px}
.ov.on{display:flex}
.card{background:var(--panel);border-radius:14px;padding:18px;text-align:center;max-width:92vw}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0 12px;color:var(--mut)}
.card.rem{text-align:left;max-width:440px;max-height:90vh;overflow:auto}.card.rem h2{text-align:center}.rem ul{margin:8px 0;padding-left:20px}.rem li{margin:3px 0}.rem .go{display:block;margin:0 auto}.presets,.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}.pick input{width:100%;height:38px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}.acts .go{margin:0}
.edonly{display:none}.edonly.show{display:inline-block}#nm,#res,#imp,#impo,#lockl,#emi{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}#lbl{margin:8px 0;padding-left:26px}#lbl li{margin:4px 0}#pvc{max-width:84vw;height:auto;border-radius:8px;display:block}
.card button.go{background:var(--acc);color:var(--accink);border-color:var(--acc)}
@media (prefers-reduced-motion:reduce){#hintc{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <h1>Step 3: LOG</h1>
  <select id="count" aria-label="Number of pieces">
    <option value="12">12 pieces</option>
    <option value="24" selected>24 pieces</option>
    <option value="48">48 pieces</option>
    <option value="96">96 pieces</option>
  </select>
  <label class="btn edonly">Use my photo<input id="file" type="file" accept="image/*" hidden></label>
